<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href='data:application/manifest+json,{"name":"校园电视台工作台","short_name":"校园电视台","start_url":".","display":"standalone","background_color":"#f1f5f9","theme_color":"#2563eb"}'>
<title>校园电视台工作台</title>
<style>
/* ===== Reset & Variables ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#f1f5f9;--surface:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;
--border:#e2e8f0;--border2:#cbd5e1;--primary:#2563eb;--primary-l:#eff6ff;--primary-d:#1d4ed8;
--success:#10b981;--success-l:#d1fae5;--warning:#f59e0b;--warning-l:#fef3c7;
--danger:#ef4444;--danger-l:#fee2e2;--purple:#8b5cf6;--purple-l:#ede9fe;
--cyan:#06b6d4;--cyan-l:#cffafe;--teal:#14b8a6;--teal-l:#ccfbf1;
--indigo:#6366f1;--indigo-l:#e0e7ff;--amber:#f59e0b;--amber-l:#fef3c7;
--radius:10px;--radius-s:6px;--radius-l:14px;
--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
--shadow-l:0 8px 24px rgba(0,0,0,.1);
--sidebar-w:216px;
--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
html{font-size:14px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:#fff;border:1px solid var(--border2);border-radius:var(--radius-s);padding:7px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
a{color:var(--primary);text-decoration:none}
svg{flex-shrink:0}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}

/* ===== Sidebar ===== */
.sidebar-logo{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.sidebar-logo .logo-icon{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--cyan));display:flex;align-items:center;justify-content:center;color:#fff}
.sidebar-logo span{font-size:15px;font-weight:700;color:var(--text)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-s);font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;margin-bottom:1px;position:relative}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{background:var(--primary-l);color:var(--primary);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .phase-tag{font-size:9px;background:var(--border);color:var(--text2);padding:1px 5px;border-radius:4px;margin-left:auto}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:6px;border-radius:var(--radius-s)}
.user-card .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0}
.user-card .info{min-width:0}
.user-card .name{font-size:13px;font-weight:600}
.user-card .role{font-size:11px;color:var(--text2)}

/* ===== Topbar ===== */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:var(--radius-s);align-items:center;justify-content:center;color:var(--text2)}
.page-title{font-size:18px;font-weight:700}
.demo-badge{font-size:11px;background:var(--warning-l);color:#92400e;padding:2px 8px;border-radius:4px;font-weight:500;display:flex;align-items:center;gap:4px}
.global-search{width:200px;border-radius:20px;padding:6px 12px;background:var(--bg);border-color:transparent;font-size:13px}
.global-search:focus{background:#fff;border-color:var(--primary)}
.role-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap}
.role-badge:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--text3)}
.role-badge.role-admin{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
.role-badge.role-admin:before{background:var(--primary)}
.role-badge:hover{border-color:var(--primary)}

/* ===== Content ===== */
.content{padding:20px 24px;flex:1}
.page{display:none}
.page.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ===== Components ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.section-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title svg{color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-radius:var(--radius-s);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;min-height:34px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{opacity:.9}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-danger:hover{background:var(--danger-l)}
.btn-sm{padding:4px 10px;font-size:12px;min-height:28px}
.btn-icon{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-s);background:transparent;color:var(--text2);transition:all .15s}
.btn-icon:hover{background:var(--bg);color:var(--text)}

/* ===== Grid ===== */
.grid{display:grid;gap:12px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.flex{display:flex}
.flex-col{flex-direction:column}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.gap-8{gap:8px}
.gap-12{gap:12px}
.gap-16{gap:16px}
.mt-8{margin-top:8px}
.mt-12{margin-top:12px}
.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}
.mb-12{margin-bottom:12px}
.text-sm{font-size:12px}
.text-t2{color:var(--text2)}
.text-t3{color:var(--text3)}
.text-primary{color:var(--primary)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.font-bold{font-weight:700}
.font-600{font-weight:600}

/* ===== Metric Cards ===== */
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.metric .m-label{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.metric .m-value{font-size:26px;font-weight:700;margin-top:4px;display:flex;align-items:baseline;gap:4px}
.metric .m-value .unit{font-size:13px;font-weight:400;color:var(--text2)}
.metric .m-trend{font-size:12px;margin-top:6px}

/* ===== Alert List ===== */
.alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.alert-item:last-child{border-bottom:none}
.alert-icon{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.alert-text{flex:1;font-size:13px;line-height:1.5}
.alert-action{font-size:12px;color:var(--primary);cursor:pointer;white-space:nowrap;flex-shrink:0}

/* ===== Kanban ===== */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
.kanban-col{flex:0 0 240px;display:flex;flex-direction:column;gap:8px;min-height:100px}
.kanban-col-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:var(--radius-s);font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--border)}
.kanban-col-header .dot{width:8px;height:8px;border-radius:50%;margin-right:6px}
.kanban-col-header .count{font-size:11px;color:var(--text2);background:var(--bg);padding:1px 6px;border-radius:8px}
.kanban-cards{display:flex;flex-direction:column;gap:8px}
.proj-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;cursor:pointer;transition:all .15s}
.proj-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.08)}
.proj-card .pc-title{font-size:13px;font-weight:600;line-height:1.4;margin-bottom:6px}
.proj-card .pc-badges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.proj-card .pc-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj-card .pc-progress{margin-top:6px}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}

/* ===== Pipeline Flow Diagram ===== */
.pipeline-flow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;margin-bottom:12px}
.pipeline-svg{width:100%;height:auto;display:block;min-width:600px}
.p-node{cursor:pointer;transition:transform .2s}
.p-node:hover{transform:translateY(-2px)}

/* ===== Metric Strip ===== */
.metric-strip{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.ms-item{flex:1;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border-right:1px solid var(--border)}
.ms-item:last-child{border-right:none}
.ms-val{font-size:24px;font-weight:700}
.ms-label{font-size:11px;color:var(--text2)}

/* ===== Flow Board ===== */
.flow-board{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.flow-col{flex:0 0 175px;display:flex;flex-direction:column;gap:6px;min-height:180px}
.flow-col-header{display:flex;align-items:center;gap:4px;padding:7px 10px;border-radius:var(--radius-s);font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.flow-col-header .fc-count{margin-left:auto;font-size:10px;background:rgba(255,255,255,.25);padding:1px 6px;border-radius:8px}
.flow-cards{display:flex;flex-direction:column;gap:6px;flex:1}
.flow-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;cursor:pointer;transition:all .15s;border-left:3px solid var(--primary)}
.flow-card:hover{box-shadow:var(--shadow-l);transform:translateY(-1px)}
.flow-card .fc-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:4px}
.flow-card .fc-badges{display:flex;gap:4px;margin-bottom:4px}
.flow-card .fc-meta{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.flow-card .fc-risk{font-size:10px;color:var(--danger);display:flex;align-items:center;gap:3px;margin-top:4px}
.flow-card .fc-people{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.flow-card .fc-person{font-size:10px;padding:1px 6px;border-radius:8px;line-height:1.6;white-space:nowrap}
.flow-empty{font-size:11px;color:var(--text3);text-align:center;padding:16px 0}

/* ===== Project Board（项目板块：按项目排列） ===== */
.project-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.pboard-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;border-top:3px solid var(--primary)}
.pboard-card:hover{box-shadow:var(--shadow-l);transform:translateY(-1px)}
.pboard-card .pb-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.pboard-card .pb-title{font-size:14px;font-weight:600;line-height:1.4}
.pboard-card .pb-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pboard-card .pb-meta{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.pboard-card .pb-people{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pboard-card .pb-person{font-size:11px;padding:2px 8px;border-radius:8px;line-height:1.6;white-space:nowrap}
.pboard-card .pb-risk{font-size:11px;color:var(--danger);display:flex;align-items:center;gap:4px;margin-top:8px}
.pboard-card .pb-progress{display:flex;align-items:center;gap:8px;margin-top:8px}
.pboard-card .pb-progress .progress-bar{flex:1}
.pboard-card .pb-step{font-size:11px;color:var(--text2);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:4px}

/* ===== Annual Timeline（年度时间轴） ===== */
.tl-wrap{min-width:1150px;overflow-x:auto}
.tl-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--text2);text-align:center;padding:4px 0}
.cal-cell{min-height:64px;border:1px solid var(--border);border-radius:8px;padding:4px 6px;background:var(--surface);overflow:hidden}
.cal-cell.cal-off{background:transparent;border-color:transparent}
.cal-cell.cal-today{border:2px solid var(--primary);background:var(--primary-l)}
.cal-day{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:3px}
.cal-today .cal-day{color:var(--primary)}
.cal-proj{font-size:11px;line-height:1.3;background:var(--primary-l);color:var(--primary);border-radius:4px;padding:1px 4px;margin-bottom:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head{font-size:11px;font-weight:600;color:var(--text2);text-align:center;padding:6px 4px;background:var(--bg);border-radius:6px}
.tl-head.tl-now{color:var(--primary);background:var(--primary-l)}
.tl-cell{min-height:46px;border:1px dashed var(--border);border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;background:var(--surface)}
.tl-cell.tl-project{min-height:56px}
.tl-proj{font-size:10px;padding:2px 5px;border-radius:4px;background:var(--primary-l);color:var(--primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tl-proj.small{background:#d1fae5;color:#065f46}
.tl-proj.key{background:#ede9fe;color:#5b21b6}
.tl-proj.archived{background:var(--bg);color:var(--text3)}
.tl-plan{font-size:11px;padding:5px 8px;border-radius:6px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.tl-plan .tl-del{opacity:.7;cursor:pointer;font-weight:400;flex-shrink:0}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
.tl-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px}

/* ===== Checkin by Object（按项目/会议选人打卡） ===== */
.qc-obj{border:1.5px solid var(--border);transition:border-color .15s}
.qc-obj.sel{border-color:var(--primary);background:var(--primary-l)}
.qc-people-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:230px;overflow-y:auto}
@media(max-width:480px){.qc-people-grid{grid-template-columns:1fr}}
.qc-person{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer;background:var(--surface)}
.qc-person input{width:15px;height:15px;flex-shrink:0}
.qc-person.done{opacity:.45}

/* ===== Table ===== */
.table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.table th{text-align:left;font-weight:600;color:var(--text2);font-size:12px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.table tr:hover td{background:var(--bg)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}

/* ===== Member Card ===== */
.member-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:12px;cursor:pointer;transition:all .15s}
.member-card:hover{border-color:var(--primary)}
.member-card .mc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.member-card .mc-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0}
.member-card .mc-name{font-size:13px;font-weight:600}
.member-card .mc-role{font-size:11px;color:var(--text2)}
.member-card .mc-info{font-size:11px;color:var(--text2);display:flex;flex-direction:column;gap:2px}
.member-card .mc-skills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.skill-tag{font-size:10px;padding:1px 6px;border-radius:3px;background:var(--bg);color:var(--text2)}

/* ===== Filter Chips ===== */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:5px 12px;border-radius:16px;font-size:12px;border:1px solid var(--border2);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== Slide Panel ===== */
.panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none}
.panel-overlay.show{display:block}
.slide-panel{position:fixed;top:0;right:0;bottom:0;width:640px;max-width:92vw;background:var(--surface);z-index:201;transform:translateX(100%);transition:transform .3s;overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.slide-panel.show{transform:translateX(0)}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10}
.panel-header h2{font-size:16px;font-weight:700;flex:1}
.panel-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);position:sticky;top:57px;background:var(--surface);z-index:9}
.panel-tab{padding:10px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.panel-body{padding:20px;flex:1}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-l);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-l)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:10;border-radius:var(--radius-l) var(--radius-l) 0 0}
.modal-header h2{font-size:16px;font-weight:700}
.modal-body{padding:20px}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ===== Stepper ===== */
.stepper{display:flex;overflow-x:auto;padding:16px 0;gap:0}
.step{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:72px;position:relative}
.step-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;z-index:1;background:var(--surface);border:2px solid var(--border);color:var(--text3)}
.step.done .step-circle{background:var(--primary);border-color:var(--primary);color:#fff}
.step.current .step-circle{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
.step-label{font-size:10px;margin-top:6px;text-align:center;color:var(--text3);max-width:64px;line-height:1.3}
.step.done .step-label,.step.current .step-label{color:var(--text)}
.step-line{position:absolute;top:14px;left:50%;width:100%;height:2px;background:var(--border)}
.step-line.done{background:var(--primary)}
.step:last-child .step-line{display:none}

/* ===== Visual Stepper (enhanced) ===== */
.vstepper{display:flex;overflow-x:auto;padding:20px 0 12px;gap:0;position:relative}
.vstep{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:78px;position:relative;z-index:1}
.vstep-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;z-index:1;background:var(--surface);border:2.5px solid var(--border);color:var(--text3);transition:all .2s}
.vstep.done .vstep-circle{color:#fff;border-color:transparent}
.vstep.current .vstep-circle{color:#fff;border-color:transparent;box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.vstep-label{font-size:10px;margin-top:8px;text-align:center;color:var(--text3);max-width:70px;line-height:1.3;font-weight:500}
.vstep.done .vstep-label,.vstep.current .vstep-label{color:var(--text);font-weight:600}
.vstep-line{position:absolute;top:18px;left:50%;width:100%;height:3px;background:var(--border);border-radius:2px}
.vstep-line.done{background:var(--primary)}
.vstep:last-child .vstep-line{display:none}

/* ===== Capacity Chart ===== */
.cap-chart{display:flex;gap:16px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;overflow-x:auto}
.cap-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:80px}
.cap-bars{display:flex;align-items:flex-end;gap:3px;height:80px}
.cap-bar{width:16px;border-radius:3px 3px 0 0;transition:height .3s}
.cap-label{font-size:11px;font-weight:600;color:var(--text)}
.cap-num{font-size:10px;color:var(--text2)}
.cap-legend{display:flex;gap:12px;font-size:11px;color:var(--text2);align-items:center;justify-content:center;padding:6px 0}
.cap-legend span{display:flex;align-items:center;gap:4px}
.cap-legend .dot{width:8px;height:8px;border-radius:2px}

/* ===== Flow Board (Project Center pipeline) ===== */
.pflow-board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;min-height:300px}
.pflow-col{flex:0 0 200px;display:flex;flex-direction:column;gap:6px}
.pflow-col-header{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:var(--radius-s);font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.pflow-col-header .pf-num{font-size:10px;opacity:.7;margin-right:2px}
.pflow-col-header .pf-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.25);padding:1px 7px;border-radius:8px}
.pflow-cards{display:flex;flex-direction:column;gap:6px;flex:1}
.pflow-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-s);padding:10px;cursor:pointer;transition:all .15s;border-left:3px solid var(--primary)}
.pflow-card:hover{box-shadow:var(--shadow-l);transform:translateY(-1px)}
.pflow-card .pf-title{font-size:12px;font-weight:600;line-height:1.4;margin-bottom:4px}
.pflow-card .pf-meta{font-size:10px;color:var(--text2);display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:3px}
.pflow-card .pf-risk{font-size:10px;color:var(--danger);margin-top:4px}
.pflow-card .pf-people{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.pflow-card .pf-person{font-size:10px;padding:1px 6px;border-radius:8px;line-height:1.6;white-space:nowrap}
.pflow-card .pf-progress{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-top:6px}
.pflow-card .pf-progress .pf-fill{height:100%;border-radius:2px}
.pflow-empty{font-size:11px;color:var(--text3);text-align:center;padding:20px 0}

/* ===== Toast ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:var(--radius-s);font-size:13px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Misc ===== */
.pending-tag{font-size:10px;background:var(--warning-l);color:#92400e;padding:1px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.empty{text-align:center;padding:32px;color:var(--text3);font-size:13px}
.divider{height:1px;background:var(--border);margin:12px 0}
.tag-row{display:flex;gap:4px;flex-wrap:wrap}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-row .label{font-size:12px;color:var(--text2)}
.info-row .value{font-size:13px;font-weight:500}
.view-toggle{display:flex;gap:2px;background:var(--bg);border-radius:var(--radius-s);padding:2px}
.view-toggle button{padding:5px 12px;border-radius:4px;font-size:12px;color:var(--text2)}
.view-toggle button.active{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}

/* ===== Calendar Grid ===== */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{min-height:64px;border:1px solid var(--border);border-radius:6px;padding:4px;background:var(--surface);cursor:pointer;overflow:hidden}
.cal-cell.cal-head{min-height:auto;background:var(--bg);font-size:11px;color:var(--text2);font-weight:600;text-align:center;cursor:default;border:none}
.cal-cell.cal-empty{background:transparent;border:none;cursor:default}
.cal-cell.has{border-color:var(--primary);background:var(--primary-l)}
.cal-cell.selected{box-shadow:0 0 0 2px var(--primary)}
.cal-num{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:2px}
.cal-tag{font-size:10px;background:var(--primary);color:#fff;border-radius:3px;padding:0 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Status Colors ===== */
.st-gray{background:#f1f5f9;color:#64748b}.st-gray .dot{background:#94a3b8}
.st-amber{background:var(--warning-l);color:#92400e}.st-amber .dot{background:var(--warning)}
.st-orange{background:#ffedd5;color:#9a3412}.st-orange .dot{background:#fb923c}
.st-red{background:var(--danger-l);color:#991b1b}.st-red .dot{background:var(--danger)}
.st-blue{background:#dbeafe;color:#1e40af}.st-blue .dot{background:#3b82f6}
.st-cyan{background:var(--cyan-l);color:#0e7490}.st-cyan .dot{background:var(--cyan)}
.st-teal{background:var(--teal-l);color:#115e59}.st-teal .dot{background:var(--teal)}
.st-indigo{background:var(--indigo-l);color:#3730a3}.st-indigo .dot{background:var(--indigo)}
.st-purple{background:var(--purple-l);color:#5b21b6}.st-purple .dot{background:var(--purple)}
.st-green{background:var(--success-l);color:#065f46}.st-green .dot{background:var(--success)}
.st-yellow{background:#fef9c3;color:#854d0e}.st-yellow .dot{background:#eab308}

/* ===== Mobile Bottom Nav ===== */
.mobile-tabbar{display:none;position:fixed;left:0;right:0;bottom:0;height:56px;background:var(--surface);border-top:1px solid var(--border);z-index:150;padding-bottom:env(safe-area-inset-bottom)}
.mt-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--text2);cursor:pointer}
.mt-item.active{color:var(--primary);font-weight:600}
.mt-item svg{width:20px;height:20px}

/* ===== Responsive ===== */
@media(max-width:1024px){
.grid-4{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.show{transform:translateX(0)}
.main{margin-left:0;padding-bottom:56px}
.menu-toggle{display:flex}
.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}
.content{padding:16px;padding-bottom:56px}
.charts-row{grid-template-columns:1fr!important}
.mobile-tabbar{display:flex}
.metric-strip{display:grid;grid-template-columns:repeat(2,1fr)}
.ms-item{border-right:none;border-bottom:1px solid var(--border)}
.flow-col{flex:0 0 150px}
.pflow-col{flex:0 0 150px}
.pipeline-flow{overflow-x:auto}
.cap-chart{flex-direction:column;align-items:stretch}
.kanban-col{flex:0 0 200px}
.slide-panel{width:100vw;max-width:100vw}
.modal{max-width:92vw}
button,.nav-item,.chip,.panel-tab{min-height:44px}
.btn{min-height:44px}
input,textarea,select{font-size:16px}
.flow-card,.pflow-card,.proj-card,.member-card{padding:12px}
.global-search{width:100%}
}

var DEMO_DATA=JSON.parse(JSON.stringify(DATA));
var LS_KEY='wb_campus_tv_data';
var LS_BACKUP_KEY='wb_campus_tv_data_bak';
var DATA_VERSION=4;
/* localStorage 可用性检测（隐私模式/禁用存储时降级为内存模式） */
var STORAGE_OK=(function(){try{localStorage.setItem('__wb_t','1');localStorage.removeItem('__wb_t');return true;}catch(e){return false;}})();
var _saveFailShown=false;

/* 数据结构完整性校验：防止损坏数据/导入脏文件导致渲染崩溃 */
function isValidData(d){
  if(!d||typeof d!=='object')return false;
  if(!Array.isArray(d.projects)||!Array.isArray(d.members))return false;
  if(!Array.isArray(d.creatives)||!Array.isArray(d.equipment)||!Array.isArray(d.alerts))return false;
  if(!Array.isArray(d.templates))return false;
  if(!Array.isArray(d.departments))return false;
  if(d.positions!==undefined&&!Array.isArray(d.positions))return false;
  if(d.checkins!==undefined&&!Array.isArray(d.checkins))return false;
  if(d.meetings!==undefined&&!Array.isArray(d.meetings))return false;
  if(d.annualPlans!==undefined&&!Array.isArray(d.annualPlans))return false;
  if(d.logs!==undefined&&!Array.isArray(d.logs))return false;
  if(!d.recruitment||!d.recruitment.funnel||typeof d.recruitment.funnel!=='object'||!Array.isArray(d.recruitment.applicants))return false;
  return true;
}
/* 合并导入数据：以 DEMO_DATA 为底补全缺失字段（含实体字段级），防止缺字段崩溃 */
function mergeData(parsed){
  var base=JSON.parse(JSON.stringify(DEMO_DATA));
  var out={};
  for(var k in base){out[k]=JSON.parse(JSON.stringify(base[k]));}
  for(var k2 in base){
    var v=parsed[k2];
    if(v===undefined||v===null)continue;
    if(Array.isArray(base[k2])&&!Array.isArray(v))continue; /* 类型不符：保留 base */
    if(typeof base[k2]==='object'&&base[k2]!==null&&!Array.isArray(base[k2])&&(typeof v!=='object'||v===null||Array.isArray(v)))continue;
    out[k2]=JSON.parse(JSON.stringify(v));
  }
  /* 实体字段级补全：项目补 crew/tasks/level/status 等，成员补 subSkills 等 */
  var sampleP=base.projects[0]||{};
  out.projects=(out.projects||[]).map(function(p){
    for(var f in sampleP){if(p[f]===undefined)p[f]=JSON.parse(JSON.stringify(sampleP[f]));}
    if(!Array.isArray(p.crew))p.crew=[];
    if(!Array.isArray(p.tasks))p.tasks=[];
    if(!Array.isArray(p.reviews))p.reviews=[];
    if(typeof p.id!=='number'||isNaN(p.id))p.id=0;
    return p;
  });
  var sampleM=base.members[0]||{};
  out.members=(out.members||[]).map(function(m){
    for(var f2 in sampleM){if(m[f2]===undefined)m[f2]=JSON.parse(JSON.stringify(sampleM[f2]));}
    if(!Array.isArray(m.subSkills))m.subSkills=[];
    if(!Array.isArray(m.trainings))m.trainings=[];
    if(!Array.isArray(m['履历']))m['履历']=[];
    if(typeof m.id!=='number'||isNaN(m.id))m.id=0;
    return m;
  });
  out.positions=out.positions||[];
  out.checkins=out.checkins||[];
  out.meetings=out.meetings||[];
  out.annualPlans=out.annualPlans||[];
  out.logs=out.logs||[];
  return out;
}

function saveData(){
  if(!STORAGE_OK){if(!_saveFailShown){_saveFailShown=true;showToast('浏览器存储不可用，本次修改仅保留在当前页面');}return;}
  if(DATA.version!==DATA_VERSION)DATA.version=DATA_VERSION;
  var json;
  try{json=JSON.stringify(DATA);}catch(e){showToast('保存失败：数据格式异常');return;}
  try{
    localStorage.setItem(LS_KEY,json);
    try{localStorage.setItem(LS_BACKUP_KEY,json);}catch(e2){}
  }catch(e){
    /* 配额满：清备份重试一次 */
    try{localStorage.removeItem(LS_BACKUP_KEY);localStorage.setItem(LS_KEY,json);}
    catch(e3){showToast('保存失败：浏览器存储空间不足');}
  }
  /* 云端同步：防抖推送 */
  try{localStorage.setItem('wb_data_updated',String(Date.now()));}catch(e){}
  if(cloudEnabled())cloudPush();
}

function loadData(){
  if(!STORAGE_OK)return;
  var parsed=null;
  try{var raw=localStorage.getItem(LS_KEY);if(raw)parsed=JSON.parse(raw);}catch(e){parsed=null;}
  /* 主数据损坏 → 尝试从备份恢复 */
  if(!parsed||!isValidData(parsed)){
    var restored=false;
    try{var bak=localStorage.getItem(LS_BACKUP_KEY);if(bak){var p2=JSON.parse(bak);if(isValidData(p2)){parsed=p2;restored=true;}}}catch(e2){}
    if(restored){showToast('检测到数据异常，已从自动备份恢复');/* 恢复成功后回写主 key，避免每次刷新重复走恢复 */try{localStorage.setItem(LS_KEY,bak);}catch(e3){}}
    else{parsed=null;}
  }
  if(parsed&&isValidData(parsed)){
    DATA=mergeData(parsed);
    migrateData();
  }
}

/* 数据迁移：按 DATA_VERSION 逐版本升级 + 旧版打卡格式迁移 */
function migrateData(){
  var changed=false;
  /* 版本字段：旧数据无 version → 视为 0，逐步升级 */
  if(typeof DATA.version!=='number'||DATA.version<DATA_VERSION){
    if(DATA.version===undefined||DATA.version<3){DATA.version=3;changed=true;}
    /* v4：清除部门初始（演示）部长名，部长待安排 */
    if(DATA.version<4){
      (DATA.departments||[]).forEach(function(d){if(d&&['林小雅','王浩然','赵明轩'].indexOf(d.head)>=0){d.head='待定';}});
      changed=true;
    }
    DATA.version=DATA_VERSION;
    changed=true;
  }
  if(!Array.isArray(DATA.checkins)){DATA.checkins=[];changed=true;}
  DATA.checkins.forEach(function(c){
    if(c&&c.type&&!c.kind){
      c.kind=c.type==='out'?'project':'meeting';
      c.refId=0;
      c.refName=c.type==='out'?'（旧）离岗记录':c.refName||'（旧）到岗记录';
      delete c.type;
      changed=true;
    }

/* 统一日期解析：支持 YYYY-MM-DD / YYYY-M-D，非法返回 null */

return dt;
}

function loadCloudSDK(){
if(window.cloudbase){initCloud();return;}
if(document.getElementById('cloudbase-sdk'))return;
if(!cloudEnabled()){cloudStatus='off';renderCloudBadge();return;}
var s=document.createElement('script');
s.id='cloudbase-sdk';
s.src='https://static.cloudbase.net/cloudbase-js-sdk/2.17.3/cloudbase.full.js';
s.onload=function(){initCloud();};
s.onerror=function(){cloudStatus='off';renderCloudBadge();};
if(document.head)document.head.appendChild(s);
}
function initCloud(){
var env=cloudEnabled();
if(!env){cloudStatus='off';renderCloudBadge();return;}
if(!window.cloudbase){loadCloudSDK();return;}
try{
cloudStatus='connecting';renderCloudBadge();
_cloudApp=window.cloudbase.init({env:env});
_cloudDb=_cloudApp.database();
_cloudApp.auth().signInAnonymously().then(function(){
cloudStatus='synced';renderCloudBadge();
cloudPull();
}).catch(function(e){
cloudStatus='error';renderCloudBadge();console.warn('CloudBase 登录失败',e);
});
}catch(e){cloudStatus='error';renderCloudBadge();console.warn('CloudBase 初始化失败',e);}
}
function cloudPull(){
if(!_cloudDb||!cloudEnabled())return;
_cloudDb.collection(CLOUD_COLL).doc(CLOUD_DOC).get().then(function(res){
if(res&&res.data&&res.data.json){
try{
var parsed=JSON.parse(res.data.json);
if(parsed&&isValidData(parsed)){
/* 时间戳保护：云端比本地旧则不覆盖（防多端回滚） */
var cloudUpdated=Number(res.data.updated)||0;
var localUpdated=Number(localStorage.getItem('wb_data_updated'))||0;
if(cloudUpdated>0&&localUpdated>0&&cloudUpdated<localUpdated){cloudStatus='synced';renderCloudBadge();return;}
DATA=mergeData(parsed);
migrateData();
try{
localStorage.setItem(LS_KEY,JSON.stringify(DATA));
if(cloudUpdated>0)localStorage.setItem('wb_data_updated',String(cloudUpdated));
}catch(e){}
cloudStatus='synced';renderCloudBadge();
try{renderPage(currentPage);}catch(e){}
showToast('已同步云端数据');
}
}catch(e){cloudStatus='error';renderCloudBadge();}
}
}).catch(function(e){cloudStatus='error';renderCloudBadge();console.warn('拉取云端失败',e);});
}
function cloudPush(){
if(!_cloudDb||!cloudEnabled())return;
clearTimeout(_pushTimer);
_pushTimer=setTimeout(function(){
try{
var payload={json:JSON.stringify(DATA),updated:Date.now()};
_cloudDb.collection(CLOUD_COLL).doc(CLOUD_DOC).set(payload).then(function(){
cloudStatus='synced';renderCloudBadge();
}).catch(function(e){cloudStatus='error';renderCloudBadge();console.warn('推送云端失败',e);});
}catch(e){}
},2000);
}

window.boardDragStart=function(e,id){_boardDragId=id;if(e&&e.dataTransfer)e.dataTransfer.effectAllowed='move';};
window.boardDragOver=function(e){if(e)e.preventDefault();};
window.boardDrop=function(e,targetId){
if(e)e.preventDefault();
if(_boardDragId===null||_boardDragId===targetId){_boardDragId=null;return;}
var order=projectCustomOrder?projectCustomOrder.slice():DATA.projects.map(function(p){return p.id;});
DATA.projects.forEach(function(p){if(order.indexOf(p.id)<0)order.push(p.id);});
var fi=order.indexOf(_boardDragId),ti=order.indexOf(targetId);
if(fi<0||ti<0){_boardDragId=null;return;}
order.splice(fi,1);
order.splice(ti,0,_boardDragId);
projectCustomOrder=order;
try{localStorage.setItem('wb_project_order',JSON.stringify(order));}catch(err){}
_boardDragId=null;
renderPage(currentPage);
showToast('项目顺序已更新');
};
function sortedProjects(projects){
var arr=projects.slice();
if(projectSortMode==='deadline'){
arr.sort(function(a,b){return (a.deadline||'9999').localeCompare(b.deadline||'9999');});
}else if(projectSortMode==='progress'){
arr.sort(function(a,b){return (b.progress||0)-(a.progress||0);});
}else if(projectSortMode==='level'){
var w={'\u91cd\u70b9':3,'\u6807\u51c6':2,'\u5c0f\u578b':1};
arr.sort(function(a,b){return (w[b.level]||0)-(w[a.level]||0);});
}else{
var order=projectCustomOrder||[];
var idx={};
order.forEach(function(id,i){idx[id]=i;});
arr.sort(function(a,b){
var ia=idx[a.id]!==undefined?idx[a.id]:9999;
var ib=idx[b.id]!==undefined?idx[b.id]:9999;
return ia-ib;
});
}
return arr;
}

window.projectAction=function(action,id){
var p=DATA.projects.find(function(x){return x.id===id;});
if(!p)return;
/* 审核真实记录：操作人 = 当前管理员身份 */
var adminName=currentAdminName();
var now=new Date();
var pad=function(n){return n<10?'0'+n:''+n;};
var todayStrNow=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
function addReview(step,result){p.reviews=p.reviews||[];p.reviews.push({step:step,result:result,by:adminName,date:todayStrNow});}
var logMap={
approve:'批准立项',return:'退回修改',reject:'拒绝立项',authorize:'授权制片',passRough:'通过初剪',returnRough:'退回初剪',passFinal:'通过终审',returnFinal:'退回终审',publish:'发布项目',retro:'填写复盘',archive:'归档项目'
};
var actions={
approve:function(){p.status='待授权制片';p.wfStep=4;addReview('台长审核','已通过');showToast('已批准立项「'+p.title+'」');},
return:function(){p.status='退回修改';p.wfStep=2;addReview('台长审核','退回修改');showToast('已退回修改「'+p.title+'」');},
reject:function(){p.status='已拒绝';p.wfStep=3;addReview('台长审核','已拒绝');showToast('已拒绝项目「'+p.title+'」');},
authorize:function(){p.status='待部长调度';p.wfStep=5;p.producer=p.producer==='待授权'||p.producer==='待定'?'待分配(台长授权)':p.producer;addReview('授权制片','已授权 '+p.producer);showToast('已授权制片人');},
passRough:function(){p.status='修改中';p.wfStep=9;addReview('初剪审核','已通过');showToast('初剪审核通过，进入修改');},
returnRough:function(){p.status='修改中';p.wfStep=9;addReview('初剪审核','退回修改');showToast('已退回修改');},
passFinal:function(){p.status='待发布';p.wfStep=9;addReview('最终审核','已通过');showToast('最终审核通过');},
returnFinal:function(){p.status='修改中';p.wfStep=9;addReview('最终审核','退回修改');showToast('已退回修改');},
publish:function(){p.status='已发布';p.wfStep=9;p.progress=100;addReview('审核发布','已发布到 '+p.platform);showToast('已发布到'+p.platform);},
retro:function(){openRetrospective(p.id);},
archive:function(){p.status='已归档';p.wfStep=10;(p.crew||[]).forEach(function(cm){var mm=DATA.members.find(function(x){return x.name===cm.name;});if(mm){mm.currentProjects=Math.max(0,(mm.currentProjects||0)-1);if(mm.currentProjects===0)mm.status='空闲';}});p.crew=[];(DATA.equipment||[]).forEach(function(e){if(e.projectId===p.id){e.status='可用';e.projectId=null;e.project=null;e.borrower=null;e.returnDate=null;}});showToast('已归档，剧组已解散、设备已归还');}
};
if(actions[action])actions[action]();
saveData();
if(logMap[action]&&action!=='retro')logAction(logMap[action],'「'+p.title+'」'+(action==='publish'?'到 '+p.platform:'')+(action==='archive'?'，剧组已解散':''));
closePanel();
setTimeout(function(){renderPage(currentPage);},100);
};

window.creativeAction=function(action,id){
var c=DATA.creatives.find(function(x){return x.id===id;});
if(!c)return;
if(action==='toProject'){
if(!isAdmin()){showToast('仅管理员可转立项');return;}
/* 从创意生成真实项目（待立项审核），管理员可在项目中心继续排人员 */
var maxId=DATA.projects.reduce(function(m,p){return Math.max(m,p.id||0);},0);
var src=c.source==='学校立项'?'学校立项':c.source==='自主立项'?'自主立项':'联合立项';
DATA.projects.push({
id:maxId+1,title:c.title,source:src,level:'标准',producer:'待授权',partner:c.submitter||'无',status:'待立项审核',progress:0,publishDate:c.hopeDate||'',crewSize:0,type:'专题',deadline:'',platform:'抖音',risk:null,wfStep:3,crew:[],tasks:[],reviews:[]
});
c.status='已立项';
logAction('创意转立项','「'+c.title+'」由创意转为立项申请（'+src+'）');
showToast('已转成立项申请，可在项目中心审批并排人员');
}else if(action==='return'){
if(!isAdmin()){showToast('仅管理员可操作');return;}
c.status='创意待整理';showToast('已退回完善');
}else if(action==='reject'){
if(!isAdmin()){showToast('仅管理员可操作');return;}
c.status='已拒绝';showToast('已拒绝该创意');
}
saveData();
closeModal();
renderPage('creative');
};

function renderCalendar(){
var html='<div class="card card-pad"><div class="flex justify-between items-center mb-12" style="flex-wrap:wrap;gap:8px"><div class="section-title" style="margin-bottom:0">'+I.calendar+'发布排期</div><div class="view-toggle"><button class="'+(calendarView==='week'?'active':'')+'" onclick="setCalendarView(\'week\')">周视图</button><button class="'+(calendarView==='month'?'active':'')+'" onclick="setCalendarView(\'month\')">月视图</button></div></div>';
html+=calendarView==='month'?renderMonthView():renderWeekView();
html+='</div>';

}
function renderWeekView(){
/* 动态生成本周（周一起）日期，避免硬编码过期 */
var now=new Date();
var dow=(now.getDay()+6)%7;
var monday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);
var pad=function(n){return n<10?'0'+n:''+n;};
var days=[];
for(var i=0;i<7;i++){
var d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);
days.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
}
var weekDays=['周一','周二','周三','周四','周五','周六','周日'];
var h='<div class="grid grid-3" style="gap:10px">';
days.forEach(function(d,i){
var projs=DATA.projects.filter(function(p){return p.publishDate===d;});
var hasProj=projs.length>0;
h+='<div class="card" style="padding:12px;border-color:'+(hasProj?'var(--primary)':'var(--border)')+'"><div class="flex justify-between items-center mb-8"><span class="font-600 text-sm">'+weekDays[i]+'</span><span class="text-sm text-t3">'+d.slice(5)+'</span></div>';
if(hasProj){
projs.forEach(function(p){
h+='<div style="padding:6px 0;border-bottom:1px solid var(--border)"><div class="text-sm font-600">'+esc(p.title)+'</div><div class="text-sm text-t2 mt-8 flex items-center gap-8"><span class="badge st-blue" style="font-size:10px">'+esc(p.platform)+'</span>'+statusBadge(p.status)+'</div></div>';
});
}else{
h+='<div class="text-sm text-t3" style="padding:8px 0">暂无排期</div>';
}
h+='</div>';
});
h+='</div>';
return h;
}
function renderMonthView(){
var base=new Date();
base.setDate(1);
base.setMonth(base.getMonth()+calendarMonthOffset);
var y=base.getFullYear(),m=base.getMonth();
var firstDow=(new Date(y,m,1).getDay()+6)%7;
var daysInMonth=new Date(y,m+1,0).getDate();
var pad=function(n){return n<10?'0'+n:''+n;};
var h='<div class="flex items-center gap-12 mb-12"><button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">上一月</button><span class="font-600">'+y+'年'+(m+1)+'月</span><button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">下一月</button></div>';
h+='<div class="cal-grid">';
['一','二','三','四','五','六','日'].forEach(function(wd){h+='<div class="cal-cell cal-head">'+wd+'</div>';});
for(var i=0;i<firstDow;i++){h+='<div class="cal-cell cal-empty"></div>';}
for(var day=1;day<=daysInMonth;day++){
var ds=y+'-'+pad(m+1)+'-'+pad(day);
var projs=DATA.projects.filter(function(p){return p.publishDate===ds;});
var sel=calendarSelectedDay===ds;
h+='<div class="cal-cell'+(projs.length>0?' has':'')+(sel?' selected':'')+'" onclick="toggleCalendarDay(\''+ds+'\')"><div class="cal-num">'+day+'</div>';
projs.forEach(function(p){h+='<div class="cal-tag" onclick="event.stopPropagation();openProject('+p.id+')">'+esc(p.title.length>7?p.title.slice(0,7)+'…':p.title)+'</div>';});
h+='</div>';
}
h+='</div>';
if(calendarSelectedDay){
var sp=DATA.projects.filter(function(p){return p.publishDate===calendarSelectedDay;});
h+='<div class="card card-pad mt-12"><div class="font-600 mb-8">'+calendarSelectedDay+' 发布项目</div>';
if(sp.length===0){h+='<div class="text-sm text-t3">该日期暂无发布</div>';}
else{sp.forEach(function(p){h+='<div class="alert-item" style="cursor:pointer" onclick="openProject('+p.id+')"><div class="alert-text">'+esc(p.title)+'</div>'+statusBadge(p.status)+'</div>';});}
h+='</div>';
}
return h;
}

/* 批量打卡：为勾选成员逐条创建记录（已打卡的跳过） */

DATA.checkins.push({id:maxId+1,member:m.name,dept:m.dept||'',kind:kind,refId:refId,refName:refName,date:today,time:time});
added++;
});
saveData();
logAction(kind==='project'?'项目打卡':'会议打卡','「'+refName+'」'+(kind==='project'?'项目':'会议')+' 打卡 '+added+' 人'+(skipped>0?'（'+skipped+' 人已打过）':''));
closeModal();
renderPage(currentPage);
if(added>0)showToast('已为 '+added+' 人打卡'+(skipped>0?'，'+skipped+' 人今日已打过':''));

};

function renderCheckinTrend(){

var days=[];
for(var i=6;i>=0;i--){
var d=new Date();d.setDate(d.getDate()-i);
var pad=function(n){return n<10?'0'+n:''+n;};
var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
var n=DATA.checkins.filter(function(c){return c.date===ds;}).length;
days.push({label:(d.getMonth()+1)+'/'+d.getDate(),count:n});
}
var maxN=1;
days.forEach(function(x){if(x.count>maxN)maxN=x.count;});
html+='<div style="display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:8px">';
days.forEach(function(x){
var h=x.count>0?Math.max(Math.round(x.count/maxN*100),4):3;
html+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;max-width:40px;height:'+h+'px;background:'+(x.count>0?'var(--primary)':'var(--border)')+';border-radius:4px 4px 0 0"></div><div class="text-sm text-t3">'+x.label+'</div><div class="text-sm font-600" style="font-size:12px">'+x.count+'</div></div>';
});
html+='</div></div>';
return html;
}

window.saveTimelinePlan=function(){

if(!title){showToast('请输入计划名称');return;}
var s=parseInt(document.getElementById('tp-start').value,10);
var e=parseInt(document.getElementById('tp-end').value,10);
if(e<s)e=s;
var cat=document.getElementById('tp-cat').value;
var plans=DATA.annualPlans||[];
var maxId=plans.reduce(function(a,x){return Math.max(a,x.id);},0);
plans.push({id:maxId+1,title:title,start:s,end:e,cat:cat,color:TL_CATS[cat]||'#64748b'});
saveData();
closeModal();
renderPage('timeline');
showToast('年度计划已添加');
};
window.removeTimelinePlan=function(id){

if(!p)return;
showConfirm('删除年度计划','确定要删除「'+esc(p.title)+'」吗？',function(){
DATA.annualPlans=DATA.annualPlans.filter(function(x){return x.id!==id;});

renderPage('timeline');

});
};
function renderTimeline(){
var html='';
html+='<div class="card card-pad mb-12" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">';
html+='<div class="flex items-center gap-8" style="flex-wrap:wrap"><span class="font-600">年度时间轴</span>';
var curYear=new Date().getFullYear();
var yrOpts='';
for(var yy=curYear-2;yy<=curYear+8;yy++){yrOpts+='<option value="'+yy+'"'+(timelineYear===yy?' selected':'')+'>'+yy+'</option>';}
html+='<select onchange="setTimelineYear(this.value)" style="max-width:110px">'+yrOpts+'</select>';
html+='<span class="text-sm text-t2">'+timelineYear+' 年 · 项目按截止月份排布，计划可补充</span></div>';
if(isAdmin())html+='<button class="btn btn-primary btn-sm" onclick="addTimelinePlan()">'+I.plus+'添加年度计划</button>';
html+='</div>';
var months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
var now=new Date();
var nowMonth=now.getMonth()+1;
/* 动态起始月：从该年份第一个有安排的月份开始（项目截止月 / 年度计划起始月） */
var firstMo=13;
DATA.projects.forEach(function(p){var pd=parseDateStr(p.deadline);if(pd&&pd.getFullYear()===timelineYear&&(pd.getMonth()+1)<firstMo)firstMo=pd.getMonth()+1;});
(DATA.annualPlans||[]).forEach(function(pl){if(pl.start&&pl.start<firstMo)firstMo=pl.start;});
if(firstMo>12)firstMo=1;
var startMo=firstMo;
var visMonths=months.slice(startMo-1);
/* 本月日历：优先展示本月项目（按截止日期排布） */
var ny=now.getFullYear(), nm=now.getMonth()+1;
var dim=new Date(ny,nm,0).getDate();
var fDow=new Date(ny,nm-1,1).getDay();
var mondayFirst=(fDow===0?6:fDow-1);
html+='<div class="card card-pad mb-12"><div class="flex justify-between items-center mb-8"><span class="section-title" style="margin:0">本月日历 · '+ny+'年'+nm+'月</span><span class="text-sm text-t2">项目按截止日期排布</span></div>';
html+='<div class="cal-grid">';
['一','二','三','四','五','六','日'].forEach(function(dd){html+='<div class="cal-dow">'+dd+'</div>';});
for(var ci=0;ci<mondayFirst;ci++)html+='<div class="cal-cell cal-off"></div>';
var todayStrFmt=fmtDate(new Date());
for(var cd=1;cd<=dim;cd++){
var ds=ny+'-'+(nm<10?'0':'')+nm+'-'+(cd<10?'0':'')+cd;
var isToday=ds===todayStrFmt;
var dayProjs=DATA.projects.filter(function(p){var pd=parseDateStr(p.deadline);return pd&&fmtDate(pd)===ds;});
html+='<div class="cal-cell'+(isToday?' cal-today':'')+'"><div class="cal-day">'+cd+(isToday?' 今':'')+'</div>';
dayProjs.forEach(function(p){
var cls=p.status==='已归档'?'archived':p.level==='\u91cd\u70b9'?'key':p.level==='\u5c0f\u578b'?'small':'';
html+='<div class="cal-proj '+cls+'" onclick="openProject('+p.id+')" title="'+esc(p.title)+' · 截止 '+esc(p.deadline)+'">'+esc(p.title)+'</div>';
});
html+='</div>';
}
var totalCells=mondayFirst+dim;
var remain=(7-totalCells%7)%7;
for(var ci2=0;ci2<remain;ci2++)html+='<div class="cal-cell cal-off"></div>';
html+='</div><div class="text-sm text-t3 mt-8">本月之外的安排见下方年度时间轴</div></div>';
html+='<div class="tl-wrap"><div class="tl-grid">';
/* 表头 */
visMonths.forEach(function(m,i){
var mm=startMo+i;
html+='<div class="tl-head'+(nowMonth===mm&&now.getFullYear()===timelineYear?' tl-now':'')+'">'+m+(nowMonth===mm&&now.getFullYear()===timelineYear?' · 今':'')+'</div>';
});
/* 项目行 */
for(var mo=startMo;mo<=12;mo++){
var projs=DATA.projects.filter(function(p){
if(!p.deadline)return false;
var pd=parseDateStr(p.deadline);
return pd&&pd.getFullYear()===timelineYear&&(pd.getMonth()+1)===mo;
});
html+='<div class="tl-cell tl-project">';
projs.forEach(function(p){
var cls=p.status==='已归档'?'archived':p.level==='\u91cd\u70b9'?'key':p.level==='\u5c0f\u578b'?'small':'';
html+='<span class="tl-proj '+cls+'" style="cursor:pointer" onclick="openProject('+p.id+')" title="'+esc(p.title)+' · '+esc(p.deadline)+'">'+esc(p.title)+'</span>';
});
if(projs.length===0)html+='<span style="font-size:10px;color:var(--text3)">—</span>';
html+='</div>';
}
/* 计划行（跨月横条，相对列定位） */
(DATA.annualPlans||[]).forEach(function(pl){
var start=Math.max(startMo,pl.start),end=Math.min(12,pl.end);
if(end<start)end=start;
html+='<div class="tl-plan" style="grid-column:'+(start-startMo+1)+' / '+(end-startMo+2)+';background:'+(pl.color||'#64748b')+'"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(pl.title)+' <span style="opacity:.75">('+pl.start+'-'+pl.end+'月)</span></span>'+(isAdmin()?'<span class="tl-del" onclick="removeTimelinePlan('+pl.id+')">×</span>':'')+'</div>';
});
html+='</div></div>';
/* 图例 + 计划列表 */
html+='<div class="card card-pad mt-12"><div class="section-title">图例与说明</div><div class="tl-legend mb-12">';
html+='<span><span class="dot" style="background:var(--primary)"></span>标准项目</span>';
html+='<span><span class="dot" style="background:#10b981"></span>小型项目</span>';
html+='<span><span class="dot" style="background:#8b5cf6"></span>重点项目</span>';
html+='<span><span class="dot" style="background:var(--bg);border:1px solid var(--border)"></span>已归档</span>';
Object.keys(TL_CATS).forEach(function(c){html+='<span><span class="dot" style="background:'+TL_CATS[c]+'"></span>计划·'+c+'</span>';});
html+='</div>';
html+='<div class="text-sm text-t2">项目标签按截止日期所在月份排布；彩色横条为年度计划'+(isAdmin()?'，点击 × 可删除':'')+'。点项目标签可查看详情。</div></div>';
/* 年度计划列表（管理员可见） */
if(isAdmin()){
var plans=DATA.annualPlans||[];
if(plans.length>0){
html+='<div class="card card-pad mt-12"><div class="section-title">年度计划清单（'+plans.length+'）</div><div class="table-wrap"><table class="table"><thead><tr><th>计划</th><th>月份</th><th>类别</th><th>操作</th></tr></thead><tbody>';
plans.forEach(function(p){
html+='<tr><td class="font-600">'+esc(p.title)+'</td><td>'+p.start+' 月 - '+p.end+' 月</td><td><span class="badge" style="background:'+(p.color||'#64748b')+'22;color:'+(p.color||'#64748b')+'">'+p.cat+'</span></td><td><button class="btn btn-ghost btn-sm" onclick="removeTimelinePlan('+p.id+')">删除</button></td></tr>';
});
html+='</tbody></table></div></div>';
}
}
return html;
}

showConfirm('清空操作记录','确定要清空全部 '+DATA.logs.length+' 条操作记录吗？',function(){
DATA.logs=[];
saveData();
renderPage(currentPage);
showToast('操作记录已清空');
});
};

];

/* ===== Init ===== */
function initApp(){
try{loadData();}catch(e){console.error('loadData失败',e);}
/* 读取身份模式 */
try{
var um=localStorage.getItem('wb_user_mode');
if(um==='admin'||um==='member')userMode=um;
var le=localStorage.getItem('wb_last_export');
if(le)lastExport=le;
}catch(e){}
try{
var uid=null;
try{uid=localStorage.getItem('wb_checkin_user');}catch(e2){}
if(uid&&DATA.members.some(function(m){return m.id===Number(uid);}))checkinUserId=Number(uid);
}catch(e){}
try{
var sm=localStorage.getItem('wb_project_sort_mode');
if(sm&&['custom','deadline','progress','level'].indexOf(sm)>=0)projectSortMode=sm;
var po=localStorage.getItem('wb_project_order');
if(po){var parsed=JSON.parse(po);if(Array.isArray(parsed))projectCustomOrder=parsed;}
}catch(e){}
applyRoleUI();
try{renderSidebar();}catch(e){console.error('renderSidebar失败',e);}
/* 云端同步初始化（配置了 envId 才会连接） */
renderCloudBadge();
try{loadCloudSDK();}catch(e){console.error('loadCloudSDK失败',e);}
/* 备份提醒：距上次导出超过 7 天且存在数据时提示（管理员可见） */
try{
if(isAdmin()&&DATA.projects.length>0){
if(!lastExport||!parseDateStr(lastExport)){
showToast('提示：请尽快导出一次数据备份');
}else{
var days=Math.floor((parseDateStr(todayStr())-parseDateStr(lastExport))/86400000);
if(!isNaN(days)&&days>=7)showToast('该备份了：距上次导出已 '+days+' 天，侧边栏可导出 JSON');
}
}
}catch(e){}
try{navigate('dashboard');}catch(e){
console.error('首次渲染失败，500ms后重试',e);
setTimeout(function(){try{navigate('dashboard');}catch(_){}},500);
}
/* 多标签页同步：另一标签页保存数据时，本页自动刷新（10 年多人场景防互相覆盖） */
try{
window.addEventListener('storage',function(e){
if(e.key===LS_KEY&&STORAGE_OK&&!cloudEnabled()){
try{
loadData();
migrateData();
renderPage(currentPage);
showToast('已检测到其他页面的数据更新并同步');
}catch(_){}
}
});
}catch(_){}
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initApp);}
else{initApp();}

})();
</script>
